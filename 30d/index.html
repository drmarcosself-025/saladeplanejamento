<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0c">
<title>Projeto Marcos 30D — Hoje</title>
<style>
  :root{
    --ink:#0e0d0c;
    --graphite:#1a1815;
    --graphite-2:#242019;
    --coffee:#3c2f24;
    --sand:#efe7da;
    --sand-dim:#a89d8c;
    --sand-faint:#6f6759;
    --gold:#c3a35f;
    --gold-dim:#8d7743;
    --green:#8bb593;
    --green-bg:rgba(139,181,147,.14);
    --line:rgba(239,231,218,.09);
    --line-strong:rgba(239,231,218,.16);
    --shadow:0 18px 40px -20px rgba(0,0,0,.6);
    --ease:cubic-bezier(.22,1,.36,1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--sand);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .serif{ font-family:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif; }
  ::selection{ background:var(--gold-dim); color:var(--ink); }
  button{ font-family:inherit; }
  a{ color:inherit; }
  .tabular{ font-variant-numeric:tabular-nums; }

  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:calc(22px + var(--safe-top)) 20px calc(96px + var(--safe-bottom));
    position:relative;
  }

  /* ---------- header ---------- */
  .head{ display:flex; flex-direction:column; gap:3px; margin-bottom:22px; }
  .head .eyebrow{ font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--sand-faint); font-weight:600; }
  .head h1{ margin:2px 0 0; font-size:27px; line-height:1.2; font-weight:600; letter-spacing:.1px; text-wrap:balance; }
  .head h1 .accent{ color:var(--gold); }

  /* ---------- energy segmented control ---------- */
  .energy{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .energy .lab{ font-size:12.5px; color:var(--sand-faint); white-space:nowrap; }
  .energy-group{ display:flex; flex:1; background:var(--graphite); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; }
  .energy-group button{
    flex:1; border:none; background:transparent; color:var(--sand-dim);
    font-size:12.8px; font-weight:600; padding:8px 6px; border-radius:9px; cursor:pointer;
    transition:background .18s var(--ease), color .18s var(--ease);
  }
  .energy-group button.active{ background:var(--coffee); color:var(--gold); }

  /* ---------- hero progress ---------- */
  .hero{
    position:relative;
    background:radial-gradient(120% 140% at 50% -10%, #211d17 0%, var(--graphite) 55%, var(--graphite) 100%);
    border:1px solid var(--line);
    border-radius:28px;
    padding:26px 22px 22px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .ring-wrap{ position:relative; width:172px; height:172px; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .ring-center .pts{ font-size:40px; font-weight:600; line-height:1; }
  .ring-center .cap{ font-size:13px; color:var(--sand-faint); margin-top:5px; }
  .hero-stats{ display:flex; width:100%; gap:10px; }
  .hero-stat{ flex:1; text-align:center; padding:10px 6px; border-radius:14px; background:rgba(239,231,218,.04); }
  .hero-stat .n{ font-size:19px; font-weight:600; display:block; }
  .hero-stat .l{ font-size:10.8px; color:var(--sand-faint); text-transform:uppercase; letter-spacing:.9px; margin-top:2px; display:block; }
  .hero-stat.streak .n{ color:var(--gold); }

  /* ---------- section label ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 12px; }
  .section-head h2{ font-size:13px; text-transform:uppercase; letter-spacing:1.3px; color:var(--sand-dim); font-weight:700; margin:0; }
  .section-head .hint{ font-size:12px; color:var(--sand-faint); }

  /* ---------- missions ---------- */
  .missions{ display:flex; flex-direction:column; gap:10px; margin-bottom:26px; }
  .mission{
    display:flex; align-items:center; gap:14px;
    background:var(--graphite); border:1px solid var(--line); border-radius:20px;
    padding:15px 16px; cursor:pointer; transition:border-color .18s var(--ease), background .18s var(--ease);
  }
  .mission:active{ transform:scale(.99); }
  .mission.done{ background:var(--graphite); border-color:var(--line); }
  .check{
    flex:0 0 auto; width:27px; height:27px; border-radius:50%; border:1.6px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; transition:background .2s var(--ease), border-color .2s var(--ease);
  }
  .check svg{ width:13px; height:13px; opacity:0; transform:scale(.5); transition:opacity .18s var(--ease), transform .18s var(--ease); }
  .mission.done .check{ background:var(--green); border-color:var(--green); }
  .mission.done .check svg{ opacity:1; transform:scale(1); }
  .mission-body{ flex:1; min-width:0; }
  .mission-title{ font-size:15.5px; font-weight:600; line-height:1.35; }
  .mission.done .mission-title{ color:var(--sand-dim); text-decoration:line-through; text-decoration-color:var(--sand-faint); text-decoration-thickness:1px; }
  .mission-meta{ font-size:12px; color:var(--sand-faint); margin-top:3px; display:flex; align-items:center; gap:6px; }
  .mission-pts{ flex:0 0 auto; font-size:13px; font-weight:700; color:var(--gold); }
  .mission.done .mission-pts{ color:var(--green); font-weight:600; }

  .rest-banner{
    display:none; align-items:center; gap:12px; background:var(--green-bg); border:1px solid rgba(139,181,147,.28);
    border-radius:18px; padding:14px 16px; margin-top:2px; margin-bottom:26px;
  }
  .rest-banner.show{ display:flex; }
  .rest-banner .ic{ flex:0 0 auto; color:var(--green); }
  .rest-banner p{ margin:0; font-size:13.6px; line-height:1.4; color:var(--sand); }
  .rest-banner p b{ color:var(--green); }

  /* ---------- habits accordion ---------- */
  .habits{ background:var(--graphite); border:1px solid var(--line); border-radius:20px; margin-bottom:22px; overflow:hidden; }
  .habits-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:none; border:none; color:var(--sand); padding:15px 16px; cursor:pointer;
  }
  .habits-toggle .left{ display:flex; align-items:center; gap:10px; }
  .habits-toggle .lab{ font-size:14.5px; font-weight:600; }
  .habits-toggle .count{ font-size:12px; color:var(--sand-faint); }
  .habits-toggle .chev{ transition:transform .22s var(--ease); color:var(--sand-faint); }
  .habits.open .chev{ transform:rotate(180deg); }
  .habits-list{ max-height:0; overflow:hidden; transition:max-height .28s var(--ease); }
  .habits.open .habits-list{ max-height:280px; }
  .habits-list-inner{ padding:0 14px 14px; display:flex; flex-direction:column; gap:2px; }
  .habit-row{ display:flex; align-items:center; gap:12px; padding:9px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .habit-row:first-child{ border-top:none; }
  .habit-check{ flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:1.4px solid var(--line-strong); display:flex; align-items:center; justify-content:center; }
  .habit-check svg{ width:10px; height:10px; opacity:0; }
  .habit-row.done .habit-check{ background:var(--green); border-color:var(--green); }
  .habit-row.done .habit-check svg{ opacity:1; }
  .habit-row span.t{ flex:1; font-size:13.8px; color:var(--sand-dim); }
  .habit-row.done span.t{ color:var(--sand-faint); text-decoration:line-through; }
  .habit-row .p{ font-size:11.5px; color:var(--sand-faint); }

  /* ---------- next commitment ---------- */
  .next{ display:flex; align-items:center; gap:13px; background:var(--graphite); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:28px; }
  .next .ic{ flex:0 0 auto; width:38px; height:38px; border-radius:12px; background:var(--coffee); display:flex; align-items:center; justify-content:center; color:var(--gold); }
  .next .body{ min-width:0; }
  .next .time{ font-size:11.5px; color:var(--gold); font-weight:700; letter-spacing:.4px; }
  .next .title{ font-size:14px; margin-top:1px; color:var(--sand); }

  /* ---------- footer actions ---------- */
  .actions{ display:flex; gap:10px; margin-top:auto; }
  .btn{
    flex:1; border:none; border-radius:16px; padding:15px 14px; font-size:14.5px; font-weight:700;
    cursor:pointer; transition:filter .15s var(--ease), transform .05s var(--ease);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{ background:var(--graphite); border:1px solid var(--line-strong); color:var(--sand); }
  .btn.ghost:hover{ background:var(--graphite-2); }
  .btn.primary{ background:linear-gradient(180deg,#d4b571,var(--gold)); color:#241c0d; }
  .btn.primary:hover{ filter:brightness(1.05); }

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:center;
  }
  .tabbar-inner{
    width:100%; max-width:460px; margin:0 16px; margin-bottom:calc(14px + var(--safe-bottom));
    background:rgba(26,24,21,.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line-strong); border-radius:22px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-around; padding:9px 8px;
  }
  .tab{ background:none; border:none; color:var(--sand-faint); display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 10px; border-radius:12px; cursor:pointer; }
  .tab.active{ color:var(--gold); }
  .tab .lab{ font-size:10.3px; font-weight:600; letter-spacing:.2px; }
  .tab-fab{
    flex:0 0 auto; width:46px; height:46px; margin-top:-22px; border-radius:50%;
    background:linear-gradient(180deg,#d4b571,var(--gold)); color:#241c0d; border:4px solid var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 18px -6px rgba(195,163,95,.6);
  }
  .tab-fab:active{ transform:scale(.94); }

  /* ---------- capture sheet ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(6,5,4,.6); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s var(--ease); z-index:60; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:460px; margin:0 auto;
    background:var(--graphite-2); border:1px solid var(--line-strong); border-bottom:none;
    border-radius:26px 26px 0 0; padding:10px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%); transition:transform .3s var(--ease); box-shadow:0 -20px 50px -20px rgba(0,0,0,.7);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-grip{ width:36px; height:4px; background:var(--line-strong); border-radius:99px; margin:6px auto 16px; }
  .sheet h3{ font-size:17px; margin:0 0 16px; font-weight:600; }
  .sheet label{ display:block; font-size:12px; color:var(--sand-faint); text-transform:uppercase; letter-spacing:.8px; font-weight:700; margin:14px 0 7px; }
  .sheet input[type=text]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); border-radius:12px; color:var(--sand);
    padding:12px 13px; font-size:15px; font-family:inherit;
  }
  .sheet input:focus{ outline:none; border-color:var(--gold-dim); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ background:var(--ink); border:1px solid var(--line-strong); color:var(--sand-dim); font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:99px; cursor:pointer; }
  .chip.active{ background:var(--coffee); border-color:var(--gold-dim); color:var(--gold); }
  .sheet .btn{ margin-top:22px; width:100%; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(96px + var(--safe-bottom)); transform:translate(-50%,10px); z-index:80;
    background:var(--sand); color:var(--ink); font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:99px;
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease); box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:360px){
    .head h1{ font-size:24px; }
    .ring-wrap{ width:152px; height:152px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="head">
    <span class="eyebrow" id="dateLabel">—</span>
    <h1 id="greeting" class="serif">Carregando<span class="accent">.</span></h1>
  </div>

  <div class="energy">
    <span class="lab">Energia</span>
    <div class="energy-group" id="energyGroup">
      <button data-e="baixa">Baixa</button>
      <button data-e="estavel" class="active">Estável</button>
      <button data-e="alta">Alta</button>
    </div>
  </div>

  <div class="hero">
    <div class="ring-wrap">
      <svg viewBox="0 0 172 172">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c3a35f"/>
            <stop offset="100%" stop-color="#8bb593"/>
          </linearGradient>
        </defs>
        <circle cx="86" cy="86" r="74" fill="none" stroke="rgba(239,231,218,.08)" stroke-width="12"/>
        <circle id="ringFg" cx="86" cy="86" r="74" fill="none" stroke="url(#ringGrad)" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"
                style="transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);"/>
      </svg>
      <div class="ring-center">
        <span class="pts tabular serif" id="ptsNow">0</span>
        <span class="cap tabular" id="ptsCap">de 150 pontos</span>
      </div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat streak">
        <span class="n tabular" id="streakNum">6</span>
        <span class="l">Sequência</span>
      </div>
      <div class="hero-stat">
        <span class="n tabular" id="missionsNum">2/3</span>
        <span class="l">Missões</span>
      </div>
      <div class="hero-stat">
        <span class="n tabular" id="habitsNum">3/5</span>
        <span class="l">Hábitos</span>
      </div>
    </div>
  </div>

  <div class="section-head">
    <h2>Três missões de hoje</h2>
    <span class="hint">o resto pode esperar</span>
  </div>
  <div class="missions" id="missionsList"></div>

  <div class="rest-banner" id="restBanner">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5A8.5 8.5 0 1 1 11.5 4a7 7 0 0 0 8.5 8.5z"/></svg></span>
    <p><b>Missões essenciais concluídas.</b> Agora sua próxima tarefa é desacelerar.</p>
  </div>

  <div class="habits" id="habitsBox">
    <button class="habits-toggle" id="habitsToggle">
      <span class="left">
        <span class="lab">Hábitos essenciais</span>
        <span class="count" id="habitsCount">3 de 5</span>
      </span>
      <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="habits-list">
      <div class="habits-list-inner" id="habitsList"></div>
    </div>
  </div>

  <div class="next">
    <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
    <div class="body">
      <div class="time">16H00</div>
      <div class="title">Fornecedor — confirmar entrega de contenções</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn ghost" id="captureBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Capturar
    </button>
    <button class="btn primary" id="endDayBtn">Encerrar meu dia</button>
  </div>

</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab active" data-tab="hoje">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span class="lab">Hoje</span>
    </button>
    <button class="tab" data-tab="semana">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg>
      <span class="lab">Semana</span>
    </button>
    <button class="tab-fab" id="fabBtn" aria-label="Capturar pendência">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="30dias">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
      <span class="lab">30 Dias</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <h3>Capturar pendência</h3>
  <label>O que precisa fazer?</label>
  <input type="text" id="captureInput" placeholder="Ex.: comprar luvas e fios">
  <label>Área</label>
  <div class="chip-row" id="areaChips">
    <button class="chip active" data-a="corpo">Corpo</button>
    <button class="chip" data-a="mente">Mente</button>
    <button class="chip" data-a="consultorio">Consultório</button>
    <button class="chip" data-a="futuro">Futuro</button>
    <button class="chip" data-a="organizacao">Organização</button>
  </div>
  <button class="btn primary" id="saveCapture">Salvar por agora</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var CAP = 150;

  var missions = [
    { title:'Academia — treino de pernas', area:'Corpo', pts:20, done:true },
    { title:'TCC — revisar capítulo 3', area:'Futuro', pts:15, done:true },
    { title:'Consultório — separar pedido de luvas e fios', area:'Consultório', pts:15, done:false }
  ];
  var habits = [
    { title:'Água ao acordar', pts:8, done:true },
    { title:'Sono até 23h', pts:8, done:true },
    { title:'Celular longe às 22h30', pts:8, done:false },
    { title:'Alongar 5 minutos', pts:8, done:true },
    { title:'Pausa ou oração à tarde', pts:8, done:false }
  ];

  var missionsList = document.getElementById('missionsList');
  var habitsList = document.getElementById('habitsList');
  var ringFg = document.getElementById('ringFg');
  var RING_LEN = 465;

  function iconCheck(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#0e0d0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  }

  function renderMissions(){
    missionsList.innerHTML = missions.map(function(m,i){
      return '<div class="mission'+(m.done?' done':'')+'" data-i="'+i+'">'+
        '<span class="check">'+iconCheck()+'</span>'+
        '<span class="mission-body"><span class="mission-title">'+m.title+'</span>'+
        '<span class="mission-meta">'+m.area+'</span></span>'+
        '<span class="mission-pts">'+(m.done?'Concluída':'+'+m.pts)+'</span>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(missionsList.querySelectorAll('.mission'), function(el){
      el.addEventListener('click', function(){
        var i = +el.dataset.i;
        missions[i].done = !missions[i].done;
        renderMissions();
        renderStats();
      });
    });
  }

  function renderHabits(){
    habitsList.innerHTML = habits.map(function(h,i){
      return '<div class="habit-row'+(h.done?' done':'')+'" data-i="'+i+'">'+
        '<span class="habit-check">'+iconCheck()+'</span>'+
        '<span class="t">'+h.title+'</span>'+
        '<span class="p">+'+h.pts+'</span>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(habitsList.querySelectorAll('.habit-row'), function(el){
      el.addEventListener('click', function(){
        var i = +el.dataset.i;
        habits[i].done = !habits[i].done;
        renderHabits();
        renderStats();
      });
    });
  }

  function renderStats(){
    var mDone = missions.filter(function(m){return m.done;});
    var hDone = habits.filter(function(h){return h.done;});
    var pts = mDone.reduce(function(s,m){return s+m.pts;},0) + hDone.reduce(function(s,h){return s+h.pts;},0);
    pts = Math.min(pts, CAP);

    document.getElementById('ptsNow').textContent = pts;
    document.getElementById('ptsCap').textContent = 'de ' + CAP + ' pontos';
    document.getElementById('missionsNum').textContent = mDone.length + '/' + missions.length;
    document.getElementById('habitsNum').textContent = hDone.length + '/' + habits.length;
    document.getElementById('habitsCount').textContent = hDone.length + ' de ' + habits.length;

    var frac = pts / CAP;
    ringFg.setAttribute('stroke-dashoffset', String(RING_LEN * (1 - frac)));

    var allMissionsDone = mDone.length === missions.length;
    document.getElementById('restBanner').classList.toggle('show', allMissionsDone);
  }

  renderMissions();
  renderHabits();
  renderStats();

  // energy selector
  document.getElementById('energyGroup').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===b); });
  });

  // habits accordion
  document.getElementById('habitsToggle').addEventListener('click', function(){
    document.getElementById('habitsBox').classList.toggle('open');
  });

  // greeting + date
  var dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var now = new Date();
  var h = now.getHours();
  var saud = h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('greeting').innerHTML = saud + ', Marcos<span class="accent">.</span>';
  document.getElementById('dateLabel').textContent = (dias[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()]).toUpperCase();

  // toast
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  // capture sheet
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('sheet');
  function openSheet(){
    scrim.classList.add('show');
    sheet.classList.add('show');
    setTimeout(function(){ document.getElementById('captureInput').focus(); }, 260);
  }
  function closeSheet(){
    scrim.classList.remove('show');
    sheet.classList.remove('show');
  }
  document.getElementById('captureBtn').addEventListener('click', openSheet);
  document.getElementById('fabBtn').addEventListener('click', openSheet);
  scrim.addEventListener('click', closeSheet);

  document.getElementById('areaChips').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===b); });
  });

  document.getElementById('saveCapture').addEventListener('click', function(){
    var val = document.getElementById('captureInput').value.trim();
    closeSheet();
    document.getElementById('captureInput').value = '';
    toast(val ? 'Pendência capturada.' : 'Sheet fechado.');
  });

  // nav tabs — só "Hoje" existe nesta fase
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      if(t.dataset.tab === 'hoje') return;
      toast('Essa tela chega na próxima fase.');
    });
  });

  document.getElementById('endDayBtn').addEventListener('click', function(){
    toast('O encerramento do dia chega na Fase 3.');
  });
})();
</script>

</body>
</html>
